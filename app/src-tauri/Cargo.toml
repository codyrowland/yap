[package]
name = "yap-app"
version = "0.1.0"
edition = "2024"
default-run = "yap-app"

[build-dependencies]
tauri-build = "=2.7.2"

[features]
local-whisper = ["dep:whisper-rs"]
input-test = []

[[bin]]
name = "yap-app"
path = "src/main.rs"

[[bin]]
name = "yap-test-app"
path = "src/main.rs"
required-features = ["input-test"]

[dependencies]
cpal = "=0.16.0"
tauri = { version = "=2.12.3", features = ["tray-icon"] }
whisper-rs = { version = "=0.16.0", optional = true }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }
