<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Yap recording</title>
  <link rel="stylesheet" href="classical.css">
  <script src="theme.js"></script>
  <style>
    html, body { background: transparent; overflow: hidden; }
    .bar { width: 100vw; height: 100vh; position: relative; display: flex; align-items: center; gap: 14px; padding: 0 10px 0 20px;
      background: var(--color-text); color: var(--color-bg); border-radius: 999px; overflow: hidden; user-select: none; }
    .bar.error { background: var(--color-accent); color: var(--color-on-accent); }
    .bar.minimal { width: fit-content; margin: 0 auto; padding: 0 20px; }
    .rec { width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--color-accent);
      box-shadow: 0 0 0 4px rgba(var(--rgb-accent), .25); animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    .wave { display: flex; align-items: center; gap: 3px; height: 30px; }
    .wave span { width: 3px; height: 4px; border-radius: 3px; background: rgba(var(--rgb-bg), .85); transition: height 60ms linear; }
    .label { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .time, .detail { font-size: 13px; font-variant-numeric: tabular-nums; opacity: .7; white-space: nowrap; }
    .time, .detail { padding-right: 10px; }
    .detail { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
    .chk { width: 22px; height: 22px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--color-accent); color: #1E1E1D; }
    .scan { position: absolute; left: 20px; right: 20px; bottom: 7px; height: 3px; border-radius: 3px; overflow: hidden;
      background: rgba(var(--rgb-bg), .14); }
    .scan i { position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 3px; background: var(--color-accent); animation: scan 1.4s ease-in-out infinite; }
    @keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    .bar .btn { height: 36px; padding: 0 16px; border: 0; border-radius: 999px; font-size: 13px; font-weight: 600; }
    .stop { color: var(--color-text); background: var(--color-bg); }
    .outline { color: var(--color-bg); background: transparent; box-shadow: inset 0 0 0 1px rgba(var(--rgb-bg), .35); }
    .outline:hover { background: rgba(var(--rgb-bg), .12); }
    @media (prefers-reduced-motion: reduce) { .rec, .scan i { animation: none; } }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <span class="rec" id="rec"></span>
    <svg id="cpu" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
    <span class="chk" id="check"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
    <svg id="warn" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <div class="wave" id="wave"></div>
    <span class="label" id="label"></span>
    <span class="detail" id="detail"></span>
    <span class="time" id="time"></span>
    <button class="btn stop" id="stop" type="button">Stop</button>
    <button class="btn outline" id="undo" type="button">Undo</button>
    <span class="scan" id="scan"><i></i></span>
  </div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const $ = id => document.getElementById(id);
    const BARS = 20;
    const levels = new Array(BARS).fill(0);
    for (let i = 0; i < BARS; i++) $('wave').append(document.createElement('span'));
    let started = 0;
    let ticker = null;
    let recording = null;   // the recording state while it lasts
    let partial = '';

    // Shows the end of the live text: trims from the start until it fits.
    function fitTail(node, text) {
      node.textContent = text;
      if (node.scrollWidth <= node.clientWidth) return;
      let start = 0;
      while (start < text.length && node.scrollWidth > node.clientWidth) {
        start += Math.max(1, Math.floor((text.length - start) / 8));
        node.textContent = '…' + text.slice(start).trimStart();
      }
    }

    function renderRecordingLabel() {
      if (!recording || recording.minimal) return;
      const live = partial.length > 0;
      // Live text needs the room the level meter would use.
      show(['wave'], !live);
      $('label').style.flex = live || !recording.toggle ? '1' : '0';
      $('time').style.flex = live || !recording.toggle ? '' : '1';
      $('label').style.fontWeight = live ? '500' : '600';
      if (live) fitTail($('label'), partial);
      else $('label').textContent = recording.toggle ? '' : 'Release to insert';
    }

    const show = (ids, on) => ids.forEach(id => $(id).toggleAttribute('hidden', !on));
    const all = ['rec', 'cpu', 'check', 'warn', 'wave', 'detail', 'time', 'stop', 'undo', 'scan'];

    function tick() {
      const seconds = Math.floor((Date.now() - started) / 1000);
      $('time').textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
    }

    function render(state) {
      clearInterval(ticker);
      show(all, false);
      $('bar').classList.toggle('error', state.state === 'error');
      const minimal = state.state === 'recording' && state.minimal;
      $('bar').classList.toggle('minimal', minimal);
      $('label').hidden = minimal;
      $('detail').textContent = '';
      recording = state.state === 'recording' ? state : null;
      $('label').style.fontWeight = '600';
      $('time').style.flex = '';
      if (state.state === 'recording') {
        started = Date.now();
        levels.fill(0);
        partial = '';
        if (minimal) {
          show(['wave'], true);
          return;
        }
        show(['rec', 'wave', 'time'], true);
        renderRecordingLabel();
        show(['stop'], state.toggle);
        tick();
        ticker = setInterval(tick, 250);
      } else if (state.state === 'transcribing') {
        show(['cpu', 'detail', 'scan'], true);
        $('label').style.flex = '1';
        $('label').textContent = 'Transcribing';
        $('detail').textContent = state.model ? `${state.engine} · ${state.model}` : state.engine;
      } else if (state.state === 'polishing') {
        show(['cpu', 'scan'], true);
        $('label').style.flex = '1';
        $('label').textContent = 'Cleaning up';
      } else if (state.state === 'done') {
        show(['check', 'undo'], true);
        $('label').style.flex = '1';
        $('label').textContent = `Inserted ${state.words} word${state.words === 1 ? '' : 's'} into ${state.app}`;
      } else if (state.state === 'error') {
        show(['warn'], true);
        $('label').style.flex = '1';
        $('label').textContent = state.message;
        $('label').title = state.message;
      }
    }

    listen('overlay-state', ({ payload }) => render(payload));
    listen('overlay-partial', ({ payload }) => {
      partial = payload || '';
      renderRecordingLabel();
    });
    listen('overlay-level', ({ payload }) => {
      // Scale RMS (speech is roughly 0.01–0.2) to 0–1 with a soft curve.
      levels.shift();
      levels.push(Math.min(1, Math.sqrt(payload * 8)));
      $('wave').childNodes.forEach((bar, i) => { bar.style.height = `${4 + levels[i] * 28}px`; });
    });
    $('stop').onclick = () => invoke('overlay_stop').catch(() => {});
    $('undo').onclick = () => invoke('overlay_undo').catch(() => {});
    render({ state: 'hidden' });
  </script>
</body>
</html>
