<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yap History</title>
  <link rel="stylesheet" href="classical.css">
</head>
<body>
  <div class="history">
    <header class="topbar"><span class="brand-square"></span>Yap
      <nav><a href="index.html">Settings</a><a href="history.html" aria-current="page">History</a></nav>
    </header>
    <div class="history-toolbar">
      <input id="query" class="input" type="search" placeholder="Search transcriptions" aria-label="Search transcriptions">
      <select id="app-filter" class="input" aria-label="Filter by app"><option>All apps</option></select>
      <span id="count"></span>
    </div>
    <div class="history-content">
      <div id="history-list" class="history-list"></div>
      <div id="history-detail" class="history-detail"></div>
    </div>
    <div id="message" role="status"></div>
  </div>
  <script src="dictate.js"></script>
  <script>
    const invoke = window.__TAURI__.core.invoke;
    const query = document.getElementById('query');
    const appFilter = document.getElementById('app-filter');
    const list = document.getElementById('history-list');
    const detail = document.getElementById('history-detail');
    const count = document.getElementById('count');
    const message = document.getElementById('message');
    let entries = [];
    let selectedId = null;

    function node(tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      return element;
    }

    function time(entry) {
      return new Date(entry.timestampMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function duration(entry) {
      const seconds = Math.round(entry.durationSeconds);
      return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
    }

    function render() {
      const filter = query.value.trim().toLowerCase();
      const visible = entries.filter(entry =>
        (appFilter.value === 'All apps' || entry.app === appFilter.value) &&
        entry.text.toLowerCase().includes(filter)
      );
      count.textContent = `${visible.length} transcription${visible.length === 1 ? '' : 's'}`;
      list.replaceChildren();
      detail.replaceChildren();
      if (visible.length === 0) {
        list.append(node('p', filter ? `No transcriptions match “${query.value}”.` : 'No transcriptions today.'));
        detail.append(node('p', 'Select a transcription.'));
        return;
      }

      if (!visible.some(entry => entry.id === selectedId)) selectedId = visible[0].id;
      list.append(node('div', 'Today', 'history-day'));
      for (const entry of visible) {
        const row = node('button', '', 'history-row');
        row.type = 'button';
        row.setAttribute('aria-selected', String(entry.id === selectedId));
        const head = node('span', '', 'history-row-head');
        head.append(node('strong', entry.app), node('span', time(entry)), node('span', duration(entry)));
        row.append(head, node('span', entry.text, 'history-row-text'));
        row.onclick = () => { selectedId = entry.id; render(); };
        list.append(row);
      }

      const selected = visible.find(entry => entry.id === selectedId);
      const header = node('div', '', 'history-detail-head');
      const title = node('div', '');
      title.append(node('small', selected.app), node('h1', `Today, ${time(selected)}`));
      const copy = node('button', 'Copy text', 'btn btn-primary');
      copy.type = 'button';
      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(selected.text);
          copy.textContent = 'Copied';
        } catch (error) {
          message.textContent = `Could not copy text: ${error}`;
        }
      };
      const remove = node('button', 'Delete', 'btn btn-secondary');
      remove.type = 'button';
      remove.onclick = async () => {
        try {
          await invoke('delete_history', { id: selected.id });
          selectedId = null;
          await refresh();
        } catch (error) {
          message.textContent = String(error);
        }
      };
      header.append(title, copy, remove);
      detail.append(header, node('p', selected.text, 'history-text'));
      const meta = node('div', '', 'history-meta');
      for (const [label, value] of [
        ['Engine', selected.engine], ['Model', selected.model],
        ['Audio', duration(selected)], ['Words', String(selected.text.trim().split(/\s+/).length)]
      ]) {
        const field = node('div', '');
        field.append(node('small', label), node('span', value));
        meta.append(field);
      }
      detail.append(meta);
    }

    async function refresh() {
      try {
        entries = (await invoke('history_entries')).sort((a, b) => b.timestampMs - a.timestampMs);
        const selectedApp = appFilter.value;
        appFilter.replaceChildren(node('option', 'All apps'));
        for (const name of [...new Set(entries.map(entry => entry.app))].sort()) {
          appFilter.append(node('option', name));
        }
        appFilter.value = selectedApp;
        if (!appFilter.value) appFilter.value = 'All apps';
        message.textContent = '';
        render();
      } catch (error) {
        message.textContent = String(error);
      }
    }

    query.oninput = render;
    appFilter.onchange = render;
    window.addEventListener('focus', refresh);
    window.__TAURI__.event.listen('history-updated', refresh);
    refresh();
  </script>
</body>
</html>
