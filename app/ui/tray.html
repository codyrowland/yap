<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Yap</title>
  <link rel="stylesheet" href="classical.css">
  <script src="theme.js"></script>
  <style>
    html, body { overflow: hidden; }
    .pop { height: 100vh; display: flex; flex-direction: column; background: var(--color-bg); border: 1px solid var(--color-divider); }
    .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
    .head .wm { flex: 1; }
    .ready { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--color-neutral-200); font-size: 11.5px; font-weight: 600; }
    .ready i { width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent); }
    .ready.busy { background: var(--color-accent-100); color: var(--color-accent-800); }
    .update { margin: 0 8px 8px; padding: 10px 10px 10px 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px;
      background: var(--color-accent-100); color: var(--color-accent-800); }
    .update svg { flex: none; }
    .update .text { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .update strong { font-size: 13px; }
    .update span { font-size: 12px; }
    .update .btn { padding: 6px 12px; font-size: 12.5px; }
    .keys { margin: 0 8px; padding: 8px; border-radius: 12px; display: flex; flex-direction: column; gap: 8px;
      background: var(--color-tray-keys); }
    .keys div { display: flex; align-items: center; gap: 6px; padding: 2px 4px; }
    .keys div > span:first-child { font-size: 13px; flex: 1; }
    .label { padding: 14px 18px 4px; font-size: 11px; font-weight: 600; color: var(--color-neutral-600); }
    .engines { display: flex; flex-direction: column; gap: 2px; }
    .engine { display: flex; align-items: center; gap: 12px; margin: 0 8px; padding: 9px 10px; border: 0; border-radius: 12px; background: transparent; text-align: left; }
    .engine:hover { background: rgba(var(--rgb-text), .06); }
    .engine[aria-checked='true'] { background: var(--color-accent-100); }
    .engine .ring { width: 16px; height: 16px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1.5px solid var(--color-neutral-400); }
    .engine[aria-checked='true'] .ring { border-color: var(--color-accent); }
    .engine[aria-checked='true'] .ring::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--color-accent); }
    .engine .text { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .engine .text strong { font-size: 13.5px; font-weight: 600; }
    .engine .text span { font-size: 12px; color: var(--color-neutral-600); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .engine.unready .text span { font-style: italic; }
    .menu { display: flex; flex-direction: column; margin-top: auto; padding: 6px 8px 8px; border-top: 1px solid var(--color-divider); }
    .menu .btn { justify-content: flex-start; font-weight: 400; font-size: 13.5px; padding: 8px 10px; }
    .menu .btn:hover { background: var(--color-surface); }
    #error { font-size: 12px; padding: 4px 18px 0; color: var(--color-accent-700); }
    #error:empty { display: none; }
  </style>
</head>
<body>
  <div class="pop">
    <div class="head"><span class="wm">yap<i>.</i></span><span class="ready" id="status"><i></i><span id="status-text">Ready</span></span></div>
    <!-- Only shown while an update is waiting. -->
    <div class="update" id="update" role="status" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
      <span class="text"><strong id="update-title"></strong><span id="update-detail">Installs and restarts Yap.</span></span>
      <button class="btn btn-primary" type="button" id="install-update">Install</button>
    </div>
    <div class="keys">
      <div><span>Hold to talk</span><span id="hold"></span></div>
      <div><span>Toggle dictation</span><span id="toggle"></span></div>
    </div>
    <div class="label">Engine</div>
    <div class="engines" id="engines" role="radiogroup" aria-label="Engine"></div>
    <div id="error" role="status"></div>
    <div class="menu">
      <button class="btn" type="button" id="history">History…</button>
      <button class="btn" type="button" id="settings">Settings…</button>
      <button class="btn" type="button" id="quit">Quit Yap</button>
    </div>
  </div>
  <script src="keys.js"></script>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const $ = id => document.getElementById(id);

    function caps(shortcut) {
      const wrap = document.createElement('span');
      wrap.style.cssText = 'display:inline-flex;gap:6px';
      for (const part of KeyCapture.labels(shortcut)) {
        const cap = document.createElement('span');
        cap.className = 'keycap keycap-small';
        cap.textContent = part;
        wrap.append(cap);
      }
      return wrap;
    }

    // ---------- update ready ----------
    // The backend reports a waiting update as `updateVersion` in tray_state
    // (null when there is none) and with an `update-ready` event.
    function showUpdate(version) {
      $('update').hidden = !version;
      if (version) $('update-title').textContent = `Yap ${version} is ready`;
    }
    $('install-update').onclick = async () => {
      $('install-update').disabled = true;
      $('update-detail').textContent = 'Installing…';
      try {
        await invoke('install_update');
      } catch (error) {
        $('update-detail').textContent = 'Installs and restarts Yap.';
        $('error').textContent = String(error);
        $('install-update').disabled = false;
      }
    };

    async function refresh() {
      try {
        const state = await invoke('tray_state');
        $('status-text').textContent = state.status;
        $('status').classList.toggle('busy', state.status !== 'Ready');
        showUpdate(state.updateVersion);
        $('hold').replaceChildren(caps(state.holdKey));
        $('toggle').replaceChildren(caps(state.toggleKey));
        const list = $('engines');
        list.replaceChildren();
        for (const engine of state.engines) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'engine' + (engine.ready ? '' : ' unready');
          button.setAttribute('role', 'radio');
          button.setAttribute('aria-checked', String(engine.id === state.engine));
          button.innerHTML = '<span class="ring"></span><span class="text"><strong></strong><span></span></span>';
          button.querySelector('strong').textContent = engine.label;
          button.querySelector('.text span').textContent = engine.detail;
          button.onclick = async () => {
            if (engine.id === state.engine) return;
            try { await invoke('set_engine', { engine: engine.id }); $('error').textContent = ''; }
            catch (error) { $('error').textContent = String(error); }
            refresh();
          };
          list.append(button);
        }
      } catch (error) {
        $('error').textContent = String(error);
      }
    }

    $('history').onclick = () => invoke('open_window', { page: 'history' });
    $('settings').onclick = () => invoke('open_window', { page: 'settings' });
    $('quit').onclick = () => invoke('quit_app');
    window.addEventListener('keydown', event => { if (event.key === 'Escape') window.__TAURI__.window.getCurrentWindow().hide(); });
    listen('tray-refresh', () => { $('error').textContent = ''; refresh(); });
    listen('settings-changed', refresh);
    listen('update-ready', ({ payload }) => showUpdate(payload));
    refresh();
  </script>
</body>
</html>
