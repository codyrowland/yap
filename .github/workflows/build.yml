name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    env:
      ARTIFACT_SIGNING_ENDPOINT: https://wus2.codesigning.azure.net/
      ARTIFACT_SIGNING_ACCOUNT: Yap
      ARTIFACT_SIGNING_PROFILE: yap-public
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri CLI
        run: |
          $zip = "$env:RUNNER_TEMP\cargo-tauri.zip"
          Invoke-WebRequest https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.4/cargo-tauri-x86_64-pc-windows-msvc.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '3e8687fb184bd7f10ebd8642f7715f79f4a605c0694c142a21507e8a24dc0f8b') {
            throw 'cargo-tauri.zip checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath "$env:USERPROFILE\.cargo\bin" -Force

      - name: Build application
        working-directory: app/src-tauri
        run: cargo tauri build --no-bundle -- --locked

      - name: Log in to Azure
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          client-id: f62486f5-c290-4f2a-887d-6584f90997d9
          tenant-id: 9540a51e-5fdf-4988-b964-070a537202d5
          subscription-id: 31781dda-89fe-4e98-a62d-7dbf73c0ac41

      - name: Sign runtime libraries
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\app\src-tauri\target\release\sherpa-onnx-c-api.dll
            ${{ github.workspace }}\app\src-tauri\target\release\onnxruntime.dll
            ${{ github.workspace }}\app\src-tauri\target\release\onnxruntime_providers_shared.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true

      - name: Build and sign installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: app/src-tauri/windows/build-installer.ps1 -Signed

      - name: Verify signatures and timestamps
        run: |
          $installers = @(Get-ChildItem 'app/src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction Stop)
          if ($installers.Count -ne 1) {
            throw "Expected one installer, found $($installers.Count)"
          }

          $installDir = Join-Path $env:RUNNER_TEMP 'yap-signing-check'
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Silent install failed with exit code $($process.ExitCode)"
          }

          $installed = @(Get-ChildItem $installDir -Recurse -File -Include '*.exe', '*.dll')
          foreach ($name in 'uninstall.exe', 'sherpa-onnx-c-api.dll', 'onnxruntime.dll', 'onnxruntime_providers_shared.dll') {
            if (-not ($installed | Where-Object Name -eq $name)) {
              throw "Installed file missing: $name"
            }
          }

          if (-not ($installed | Where-Object { $_.Extension -eq '.exe' -and $_.Name -ne 'uninstall.exe' })) {
            throw 'Installed application executable missing'
          }

          $files = @($installers[0].FullName) + $installed.FullName
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.TimeStamperCertificate) {
              throw "Signature or timestamp verification failed: $file ($($signature.Status))"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Yap-windows-x64
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 7

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            tauri-cli: cargo-tauri-aarch64-apple-darwin.zip
            tauri-cli-sha256: f71a34ada728ca2d1a51c28d6d21639e1e080898ec69ec8d49c5da3b7e8bc1be
          - runner: macos-15-intel
            arch: x64
            tauri-cli: cargo-tauri-x86_64-apple-darwin.zip
            tauri-cli-sha256: 164d184c0e50800dcae7bb31f0815066ebd27efc3e3bb73117974bcd2e982192
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing credentials
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret: $name"
              exit 1
            fi
          done
          if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application: "* ]]; then
            echo '::error::A Developer ID Application signing identity is required'
            exit 1
          fi

      - name: Install Tauri CLI
        env:
          TAURI_CLI: ${{ matrix.tauri-cli }}
          TAURI_CLI_SHA256: ${{ matrix.tauri-cli-sha256 }}
        run: |
          zip="$RUNNER_TEMP/$TAURI_CLI"
          curl -fsSL --retry 3 -o "$zip" "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.4/$TAURI_CLI"
          echo "$TAURI_CLI_SHA256  $zip" | shasum -a 256 -c -
          mkdir -p "$HOME/.cargo/bin"
          unzip -o -q "$zip" cargo-tauri -d "$HOME/.cargo/bin"
          cargo tauri --version

      - name: Build, sign, and notarize
        working-directory: app/src-tauri
        run: cargo tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked

      - name: Name updater bundle by architecture
        run: |
          name=$(basename app/src-tauri/target/release/bundle/dmg/*.dmg .dmg)
          cd app/src-tauri/target/release/bundle/macos
          mv Yap.app.tar.gz "$name.app.tar.gz"
          mv Yap.app.tar.gz.sig "$name.app.tar.gz.sig"

      - name: Verify signing and notarization
        run: |
          app='app/src-tauri/target/release/bundle/macos/Yap.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Notarize DMG
        run: |
          dmg=$(ls app/src-tauri/target/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Yap-macos-${{ matrix.arch }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 7

  updater-manifest:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write latest.json
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          base="https://github.com/codyrowland/yap/releases/download/v$version"
          entry() {
            jq -n --arg url "$base/$1" --rawfile signature "artifacts/$1.sig" '{signature: $signature, url: $url}'
          }
          jq -n --arg version "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson windows "$(entry "Yap_${version}_x64-setup.exe")" \
            --argjson arm "$(entry "Yap_${version}_aarch64.app.tar.gz")" \
            --argjson intel "$(entry "Yap_${version}_x64.app.tar.gz")" \
            '{version: $version, pub_date: $date, platforms: {"windows-x86_64": $windows, "darwin-aarch64": $arm, "darwin-x86_64": $intel}}' \
            > latest.json
          cat latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: Yap-updater
          path: latest.json
          if-no-files-found: error
          retention-days: 7
