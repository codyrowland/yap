name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri CLI
        run: |
          $zip = "$env:RUNNER_TEMP\cargo-tauri.zip"
          Invoke-WebRequest https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.4/cargo-tauri-x86_64-pc-windows-msvc.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '3e8687fb184bd7f10ebd8642f7715f79f4a605c0694c142a21507e8a24dc0f8b') {
            throw 'cargo-tauri.zip checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath "$env:USERPROFILE\.cargo\bin" -Force

      - name: Build installer
        run: app/src-tauri/windows/build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Yap-windows-x64
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Yap.app
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles app

      - name: Zip
        working-directory: app/src-tauri/target/release/bundle/macos
        run: ditto -c -k --keepParent Yap.app Yap-macos-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Yap-macos-${{ matrix.arch }}
          path: app/src-tauri/target/release/bundle/macos/Yap-macos-${{ matrix.arch }}.zip
          retention-days: 7
